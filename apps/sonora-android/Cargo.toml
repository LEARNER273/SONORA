[package]
name = "sonora-android"
version = "1.0.0"
edition = "2021"
authors = ["SONORA Audio Systems <dev@sonora.audio>"]
license = "MIT"

[lib]
name = "sonora"
crate-type = ["cdylib", "rlib"]

[dependencies]
sonora-core = { path = "../../crates/sonora-core" }
sonora-dsp = { path = "../../crates/sonora-dsp" }
sonora-instruments = { path = "../../crates/sonora-instruments" }
sonora-sequencer = { path = "../../crates/sonora-sequencer" }
sonora-audio = { path = "../../crates/sonora-audio" }
sonora-midi = { path = "../../crates/sonora-midi" }
sonora-codecs = { path = "../../crates/sonora-codecs" }
sonora-project = { path = "../../crates/sonora-project" }
sonora-renderer = { path = "../../crates/sonora-renderer" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
